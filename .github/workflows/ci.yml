name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install without pyodbc (no ODBC driver on GitHub runners for CI)
          grep -v pyodbc requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Run tests
        env:
          DB_MODE: sqlite
          SQLITE_DB_PATH: /tmp/test.db
          AZURE_OPENAI_ENDPOINT: https://fake.openai.azure.com/
          AZURE_OPENAI_API_KEY: fake-key-for-ci
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -t chatbot-api:ci-check .
